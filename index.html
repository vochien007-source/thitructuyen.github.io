<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website của tôi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #222;
      text-align: center;
      padding: 80px 20px;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #0969da;
    }

    a {
      color: #0969da;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Xin chào!</h1>
    <p>Đây là website đầu tiên của tôi được đăng miễn phí bằng GitHub Pages.</p>
    <p><a href="https://github.com">Tìm hiểu thêm về GitHub</a></p>
  </div>
</body>
</html>
